services:
  - type: web
    name: medical-studycat-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: APP_ADMIN_TOKEN
        sync: false
      - key: APP_PARENT_TOKEN
        sync: false
      - key: MEDISCHEDULE_API_BASE
        value: https://www.medischedule.kr/api
      - key: MENTORING_API_BASE
        value: https://mentoring-api-6l1a.onrender.com
      - key: MEDIWEEKLY_API_BASE
        value: https://web-new-weekly-plan-maker.onrender.com
      - key: MEDIPENALTY_API_BASE
        value: https://www.medipenalty.kr/api
      - key: MEDISCHEDULE_TOKEN
        sync: false
      - key: MENTORING_TOKEN
        sync: false
      - key: MEDIWEEKLY_TOKEN
        sync: false
      - key: MEDIPENALTY_TOKEN
        sync: false
